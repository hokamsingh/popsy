# Publishes @popsy-render/runtime to npm when a GitHub release tagged `runtime-vX.Y.Z` is published.
# The tag's version must match packages/runtime/package.json.
# Uses npm trusted publishing (no token): on npmjs.com the package's Settings → Trusted Publisher
# must name GitHub Actions, repository hokamsingh/popsy and workflow publish-runtime.yml.
name: Publish runtime package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check everything, but don't publish"
        type: boolean
        default: true

concurrency:
  group: publish-runtime
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'runtime-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships with npm 10.
      - run: npm install -g npm@11

      - name: Read the package version
        id: version
        run: echo "version=$(node -p "require('./packages/runtime/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "runtime-v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match packages/runtime/package.json version $VERSION (expected runtime-v$VERSION)."
            exit 1
          fi

      - name: Check this version isn't on npm yet
        id: exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@popsy-render/runtime@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::warning::@popsy-render/runtime@$VERSION is already published; bump the version to release again."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:runtime

      - name: Publish to npm
        if: steps.exists.outputs.already == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        working-directory: packages/runtime
        # No token: npm exchanges this run's GitHub identity for a one-time publish credential,
        # and adds provenance automatically for public repositories.
        run: npm publish --access public

      - name: Dry run (nothing published)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: packages/runtime
        run: npm publish --access public --dry-run
